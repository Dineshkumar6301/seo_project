name: Daily Rank Check

on:
  schedule:
    - cron: '0 5 * * *'  # Daily at 05:00 UTC
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Rank Check API
        run: |
          curl -X GET \
          -H "X-API-KEY: ${{ secrets.RANK_CHECK_API_KEY }}" \
          https://digital-marketing-q6hei.ondigitalocean.app/api/run-rank-check/
